<style>
  /* For Chrome, Edge, Safari */
::-webkit-scrollbar {
    display: none;
}

/* For Firefox */
* {
    scrollbar-width: none;
}
  .calendar {
   width: 900px;   
    margin: 80px auto;     
    height: 500px;  
    background:#fff;    
  }
  .fc-event-title {
    text-align: left;
  }
 /* Main container for side-by-side horizontal layout */
.horizontal-container {
    display: flex;
    flex-direction: row;     /* Horizontal alignment */
    justify-content: center; /* Center horizontally */
    align-items: flex-start; /* Align top edges */
    gap: 50px;               /* Space between calendar and chart */
    margin-top: 20px;
}

/* Chart box */
.chart-wrapper {
  margin-top: 90px;
    width: 400px;
    padding: 20px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    text-align: center;
}

/* Chart size */
.chart-wrapper canvas {
    width: 400px !important;
    height: 400px !important;
}


</style>

{% extends "base.html" %}

{% block body %}

<div class="container mt-4">

 <!-- Wrapper to align everything vertically -->
<div class="horizontal-container">

    <!-- Calendar -->
    <div id="calendar" class="calendar"></div>

    <!-- Chart -->
    <div class="chart-wrapper">
        <h4 class="text-center mb-3">Today's Task Status</h4>
        <canvas id="todoChart"></canvas>
    </div>

</div>



  <!-- Todo List for clicked date -->
  <div id="todoList" class="mt-3"></div>  
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {

  /* ------------------------- FULL CALENDAR ----------------------------- */
  var calendarEl = document.getElementById('calendar');
  var calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    events: '/events',

    eventContent: function(info) {
      let title = info.event.title;
      if(info.event.extendedProps.completed){
        return { 
          html: '<span style="text-decoration: line-through; color: white;font-size:1rem;background-color:green;">' + title + '</span>' 
        };
      } else {
        return { html: '<span>' + title + '</span>' };
      }
    },

    dateClick: function(info) {
      fetch(`/todos_by_date/${info.dateStr}`)
        .then(response => response.json())
        .then(data => {
          let container = document.getElementById("todoList");
          container.innerHTML = "";

          if (data.length === 0) {
            container.innerHTML = `<p>No todos for ${info.dateStr}</p>`;
          } else {
            let html = `<h4>Todos for ${info.dateStr}</h4><ul class="list-group">`;
            data.forEach(t => {
              let title = t.completed
                ? `<span style="text-decoration: line-through;color:white;font-size:1.2rem;background-color:green;">${t.title}</span>`
                : t.title;

              html += `
                <li class="list-group-item">
                  <strong>${title}</strong> (${t.from_time} - ${t.to_time})<br>
                  ${t.content}
                </li>`;
            });
            html += "</ul>";
            container.innerHTML = html;
          }
        });
    }
  });
  calendar.render();


  /* --------------------------- CHART SECTION --------------------------- */

  fetch("/chart-data")
    .then(response => response.json())
    .then(chart => {

      let ctx = document.getElementById("todoChart");

      new Chart(ctx, {
        type: "pie",
        data: {
          labels: chart.labels,
          datasets: [{
            data: chart.data,
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: "top",
            }
          }
        }
      });

    });

});
</script>

{% endblock %}
